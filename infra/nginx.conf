# Rate Limiting Zones (Anti-Scraping & Bulk Harvester Protection)
limit_req_zone $binary_remote_addr zone=rxm_infra_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=rxm_infra_media:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=rxm_infra_api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/webp;

    # Security Headers (OWASP Hardening & Clickjacking Defense)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.tiktok.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://rxmautomobile.ro https://*.googleapis.com https://*.tiktok.com https://*.tiktokv.com; frame-src 'self' https://www.tiktok.com https://*.tiktok.com https://www.youtube.com https://*.youtube.com https://maps.google.com https://www.google.com; frame-ancestors 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Anti-Scraping WAF Shield: Blocare User-Agents malițioși
    if ($http_user_agent ~* (Bytespider|CCBot|GPTBot|anthropic-ai|Claude-Web|Scrapy|python-requests|aiohttp|Go-http-client)) {
        return 403 "Acces restrictionat conform politicii de protectie a continutului RXM Automobile.";
    }

    # Blocare acces la fișiere sau directoare ascunse (cu excepția .well-known pentru SSL)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Permite descărcarea pachetelor publice de instalare din /downloads/ (extensie ParcOS)
    location ^~ /downloads/ {
        limit_except GET HEAD {
            deny all;
        }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Blocare acces la fișiere sensibile de configurare, mediu sau backup
    location ~* \.(?:env|git|bak|old|sql|tar|gz|zip|yml|yaml|md|lock)$ {
        deny all;
        return 404;
    }

    # Secure Reverse Proxy Gateway pentru Google Gemini Vision OCR (Zero client exposure)
    location ^~ /api/ocr/gemini/ {
        limit_except POST OPTIONS {
            deny all;
        }

        rewrite ^/api/ocr/gemini/(.*)$ /v1beta/$1 break;
        proxy_pass https://generativelanguage.googleapis.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_set_header Content-Type application/json;
        proxy_set_header x-goog-api-client "gl-js/rxm-ocr-v2";
        proxy_hide_header Alt-Svc;

        proxy_connect_timeout 15s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;
    }

    # RXM Micro-API Reverse Proxy (Self-Hosted Node.js Backend)
    location ~* ^/(?:rxm/)?api/(.*)$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $rxm_api_upstream "http://rxm-api:3001/api/$1$is_args$args";
        limit_req zone=rxm_infra_api burst=50 nodelay;

        proxy_pass $rxm_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Admin-Token $http_x_admin_token;

        client_max_body_size 50M;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Servire Fotografii Mașini din disc (cu cache 1 an și compresie)
    location /rxm/cars/ {
        limit_req zone=rxm_infra_media burst=60 nodelay;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /rxm {
        limit_req zone=rxm_infra_general burst=50 nodelay;
        try_files $uri $uri/ /rxm/index.html;
    }

    location /rxm/assets/ {
        limit_req zone=rxm_infra_media burst=40 nodelay;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
